version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/venv
      - /app/__pycache__
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PORT=5000
    restart: unless-stopped 