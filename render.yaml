services:
  - type: web
    name: mystartup-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.8.0
      - key: FIREBASE_ADMIN_SDK_PATH
        sync: false
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
    healthCheckPath: /health
    autoDeploy: true 