services:
  - type: web
    name: face-recognition-backend
    env: docker
    region: singapore  # Choose the region closest to your users
    plan: starter  # Free tier
    healthCheckPath: /health
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: PORT
        sync: false  # Render will set this automatically
    buildCommand: docker build -t face-recognition-backend .
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --log-level info 